<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Crear viaje (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<svg width="240" height="200" viewBox="0 0 240 200" aria-hidden="true" style="position: absolute; right: -30px; top: 70px"><circle cx="170" cy="70" r="70" style="fill: var(--lima)"></circle><path d="M10 180 C 60 180, 80 100, 130 110 S 200 140, 170 70" style="fill: none; stroke: var(--tinta); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0.1 13"></path><circle cx="170" cy="70" r="9" style="fill: var(--papel); stroke: var(--tinta); stroke-width: 4"></circle></svg>
<div style="position: relative; padding: 48px 16px 120px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: center">
<x-import component-from-global-scope="PX.Button" variant="fantasma" size="sm">Cancelar</x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 40px">
<p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">NUEVO VIAJE</p>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 44px; line-height: 44px; font-weight: 800; letter-spacing: -0.03em; max-width: 280px">¿A dónde<br>se van?</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<x-import component-from-global-scope="PX.TextField" label="Destino" placeholder="Ciudad, provincia o país" default-value="Bariloche"></x-import>
<div style="display: flex; gap: 8px"><x-import component-from-global-scope="PX.Chip">Todavía no sabemos</x-import></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600">¿Cuándo?</span>
<div style="display: flex; gap: 8px">
<a href="#" style="flex: 1; display: flex; flex-direction: column; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--linea-fuerte); background: var(--papel-elevado); color: var(--tinta); text-decoration: none"><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Ida</span><b style="font-family: var(--font-display); font-size: 22px; line-height: 26px">jue 14 ene</b></a>
<a href="#" style="flex: 1; display: flex; flex-direction: column; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--linea-fuerte); background: var(--papel-elevado); color: var(--tinta); text-decoration: none"><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Vuelta</span><b style="font-family: var(--font-display); font-size: 22px; line-height: 26px">jue 21 ene</b></a>
</div>
<div style="display: flex; gap: 8px"><x-import component-from-global-scope="PX.Chip">Lo votamos después</x-import></div>
</div>
<x-import component-from-global-scope="PX.TextField" label="Nombre del viaje" default-value="Bariloche con los chicos" hint="Así lo va a ver todo el grupo"></x-import>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600">¿Con quién?</span>
<div style="display: flex; gap: 8px">
<x-import component-from-global-scope="PX.Chip" selected="{{yes}}" tone="previaje">En grupo</x-import>
<x-import component-from-global-scope="PX.Chip">Solo</x-import>
</div>
</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 32px">
<x-import component-from-global-scope="PX.Button" variant="primario" full="{{yes}}" icon-right="chevron">Crear e invitar al grupo</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
