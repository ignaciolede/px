<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Mis viajes (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<div style="padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center">
<p style="margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 24px; font-weight: 800; letter-spacing: -0.03em">PX<span style="color: var(--mandarina)">.</span></p>
<a href="#" aria-label="Tu perfil" style="width: 44px; height: 44px; border-radius: 50%; background: var(--lima); color: var(--sobre-color); display: grid; place-items: center; font-weight: 700; text-decoration: none">N</a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 42px; font-weight: 700; letter-spacing: -0.03em">Hola, Nacho</h1>
<p style="margin: 0; font-size: 17px; line-height: 24px; color: var(--tinta-suave)">Tenés un viaje en curso y dos por venir.</p>
</div>
<a href="#" style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 28px; background: var(--mandarina); color: var(--sobre-color); text-decoration: none; overflow: hidden">
<svg width="160" height="120" viewBox="0 0 160 120" aria-hidden="true" style="position: absolute; right: -10px; top: -6px"><path d="M10 100 C 50 100, 60 30, 110 40 S 150 70, 150 20" style="fill: none; stroke: var(--sobre-color); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0.1 13; opacity: 0.55"></path><circle cx="150" cy="20" r="8" style="fill: var(--papel); stroke: var(--sobre-color); stroke-width: 4"></circle></svg>
<span style="align-self: flex-start; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; background: var(--papel); color: var(--tinta); padding: 3px 10px; border-radius: 999px">EN CURSO · DÍA 2 DE 4</span>
<span style="font-family: var(--font-display); font-size: 34px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Mar de las<br>Pampas</span>
<span style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; line-height: 20px; font-weight: 600">Finde en familia · 4 personas</span>
<span style="display: inline-flex; align-items: center; gap: 6px; background: var(--tinta); color: var(--papel); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700">Abrir Hoy <x-import component-from-global-scope="PX.Icon" name="chevron" size="{{sixteen}}"></x-import></span>
</span>
</a>
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">PRÓXIMOS</p>
<x-import component-from-global-scope="PX.TripCard" title="Bariloche con los chicos" place="Bariloche" dates="14–21 ene · faltan 23 días" stage="previaje" people="{{chicos}}" pending="Te toca votar el alojamiento"></x-import>
<a href="#" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--papel-elevado); color: var(--tinta); text-decoration: none; box-shadow: var(--sombra-card)">
<span style="width: 48px; height: 48px; border-radius: 14px; background: var(--lima-tinte); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px">?</span>
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">Escapada al norte</b><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Destino y fechas sin definir · 3 propuestas</span></span>
<x-import component-from-global-scope="PX.Icon" name="chevron"></x-import>
</a>
</div>
</div>
<div style="position: absolute; right: 16px; bottom: 100px; border-radius: 999px; box-shadow: var(--sombra-flotante)">
<x-import component-from-global-scope="PX.Button" variant="primario" icon="plus">Crear viaje</x-import>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 20px">
<x-import component-from-global-scope="PX.BottomNav" items="{{nav}}" default-active="viajes"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
sixteen: 16,
chicos: ['Nacho', 'Fede', 'Santi', 'Juan Cruz', 'Pedro', 'Tomi'],
nav: [{ id: 'viajes', label: 'Mis viajes', icon: 'route' }, { id: 'vos', label: 'Vos', icon: 'user' }]
};
}
}
</script>
