<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Decidir (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<div style="padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Plan</h1>
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: var(--tinta-suave)">Bariloche · previaje</span>
</div>
<div style="display: flex; gap: 8px">
<x-import component-from-global-scope="PX.Chip" selected="{{yes}}" tone="previaje">Decidir · 2</x-import>
<x-import component-from-global-scope="PX.Chip">Itinerario</x-import>
<x-import component-from-global-scope="PX.Chip">Mapa</x-import>
</div>
<section style="border-radius: 28px; background: var(--papel-elevado); box-shadow: var(--sombra-card); overflow: hidden">
<div style="background: var(--lima); color: var(--sobre-color); padding: 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em">VOTACIÓN · CIERRA EL VIE 11</span>
<h2 style="margin: 0; font-family: var(--font-display); font-size: 36px; line-height: 36px; font-weight: 800; letter-spacing: -0.03em">¿Dónde dormimos?</h2>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="display: flex; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 50%; background: var(--sobre-color)"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: var(--sobre-color)"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: var(--sobre-color)"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sobre-color); box-sizing: border-box"></span></span>
<span style="font-size: 14px; line-height: 20px; font-weight: 600">Con 4 votos pasa al plan. Falta 1.</span>
</div>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<x-import component-from-global-scope="PX.PollOption" label="Cabaña Los Coihues" detail="$ 38.000 la noche · 4 km del centro" votes="{{three}}" total="{{six}}"></x-import>
<x-import component-from-global-scope="PX.PollOption" label="Hostel del Lago" detail="$ 22.000 la noche · centro" votes="{{one}}" total="{{six}}"></x-import>
<x-import component-from-global-scope="PX.PollOption" label="Depto. en Melipal" detail="$ 31.000 la noche" votes="{{zero}}" total="{{six}}"></x-import>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px">
<span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Faltan vos y Santi</span>
<x-import component-from-global-scope="PX.Button" variant="fantasma" size="sm" icon="plus">Proponer</x-import>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">OTRAS VOTACIONES</h2>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--papel-elevado); color: var(--tinta); text-decoration: none; box-shadow: var(--sombra-card)">
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">¿Alquilamos auto?</b><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Ya votaste · 5 de 6</span></span>
<x-import component-from-global-scope="PX.Icon" name="chevron"></x-import>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--papel-hundido); color: var(--tinta); text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">Fechas del viaje</b><span style="font-size: 13px; line-height: 18px; color: var(--positivo); font-weight: 600">Decidido: 14 al 21 de enero</span></span>
<x-import component-from-global-scope="PX.Icon" name="check"></x-import>
</a>
</section>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 20px">
<x-import component-from-global-scope="PX.BottomNav" default-active="plan"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, six: 6, three: 3, one: 1, zero: 0 };
}
}
</script>
</body>
</html>
