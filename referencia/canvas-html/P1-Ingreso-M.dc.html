<!doctype html>

<div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column; gap: 12px">

<x-import component-from-global-scope="PX.Button" variant="secundario" full="{{yes}}">Seguir con Apple</x-import>
