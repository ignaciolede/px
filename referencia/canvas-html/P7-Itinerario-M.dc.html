<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Itinerario (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<div style="padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Plan</h1>
<x-import component-from-global-scope="PX.Button" variant="fantasma" size="sm" icon="calendar">Calendario</x-import>
</div>
<div style="display: flex; gap: 8px">
<x-import component-from-global-scope="PX.Chip">Decidir · 2</x-import>
<x-import component-from-global-scope="PX.Chip" selected="{{yes}}" tone="previaje">Itinerario</x-import>
<x-import component-from-global-scope="PX.Chip">Mapa</x-import>
</div>
<div style="display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow: hidden">
<a href="#" style="flex: none; width: 64px; padding: 10px 0; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--tinta-suave)">jue</span><span style="font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700">14</span></a>
<a href="#" style="flex: none; width: 64px; padding: 10px 0; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--tinta-suave)">vie</span><span style="font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700">15</span></a>
<a href="#" aria-current="date" style="flex: none; width: 64px; padding: 10px 0; border-radius: 20px; background: var(--tinta); color: var(--papel); text-decoration: none; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600">sáb</span><span style="font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700">16</span></a>
<a href="#" style="flex: none; width: 64px; padding: 10px 0; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--tinta-suave)">dom</span><span style="font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700">17</span></a>
<a href="#" style="flex: none; width: 64px; padding: 10px 0; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--tinta-suave)">lun</span><span style="font-family: var(--font-display); font-size: 26px; line-height: 30px; font-weight: 700">18</span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">DÍA 3 · SÁBADO 16</p>
<h2 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">Día de montaña</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--aviso-relleno); color: var(--sobre-color)">
<span style="font-size: 15px; line-height: 21px"><b>Se pisan dos planes:</b> el chocolate termina 16:45 y el traslado al cerro Otto sale 16:30.</span>
<span style="display: flex; gap: 8px"><x-import component-from-global-scope="PX.Button" variant="secundario" size="sm">Correr el traslado a 17:00</x-import></span>
</div>
<div>
<x-import component-from-global-scope="PX.ItineraryItem" time="08:30" title="Desayuno en la cabaña"></x-import>
<x-import component-from-global-scope="PX.ItineraryItem" time="10:00" title="Subida al Cerro Catedral" place="Base del cerro · 20 min en auto"></x-import>
<x-import component-from-global-scope="PX.ItineraryItem" time="15:30" title="Chocolate en el centro" place="Mitre 450"></x-import>
<x-import component-from-global-scope="PX.ItineraryItem" time="20:30" title="Cena en El Boliche de Alberto" place="Villegas 347" last="{{yes}}"></x-import>
</div>
</div>
<div style="position: absolute; right: 16px; bottom: 100px; border-radius: 999px; box-shadow: var(--sombra-flotante)">
<x-import component-from-global-scope="PX.Button" variant="primario" icon="plus">Agregar plan</x-import>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 20px">
<x-import component-from-global-scope="PX.BottomNav" default-active="plan"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
