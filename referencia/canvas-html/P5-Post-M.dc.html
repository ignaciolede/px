<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Resumen Post-viaje (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<header style="background: var(--cielo); color: var(--sobre-color); border-radius: 0 0 32px 32px; padding: 52px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="#" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--sobre-color); font-weight: 600; font-size: 15px; text-decoration: none"><span style="display: inline-block; transform: scaleX(-1)"><x-import component-from-global-scope="PX.Icon" name="chevron"></x-import></span>Bariloche con los chicos</a>
</div>
<p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em">VOLVIERON HACE 2 DÍAS</p>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; line-height: 26px; font-weight: 600">Te falta poner</span>
<span style="font-family: var(--font-display); font-size: 68px; line-height: 64px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">$ 12.400</span>
<span style="font-size: 20px; line-height: 26px; font-weight: 600">para quedar a mano.</span>
</div>
<x-import component-from-global-scope="PX.StageSwitch" default-value="post"></x-import>
</header>
<div style="padding: 24px 16px 120px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--cielo-tinte); font-size: 15px; line-height: 21px"><x-import component-from-global-scope="PX.Icon" name="route"></x-import><span><b>Simplificamos las cuentas:</b> 4 transferencias en vez de 11.</span></div>
<section style="display: flex; flex-direction: column; gap: 8px">
<x-import component-from-global-scope="PX.BalanceRow" name="Fede" amount="{{fede}}"></x-import>
<x-import component-from-global-scope="PX.BalanceRow" name="Tomi" amount="{{tomi}}"></x-import>
<x-import component-from-global-scope="PX.BalanceRow" name="Santi" amount="{{zero}}"></x-import>
</section>
<div style="display: flex; gap: 8px">
<x-import component-from-global-scope="PX.Button" variant="primario" style="flex: 1">Pagarle a Fede</x-import>
<x-import component-from-global-scope="PX.Button" variant="secundario" style="flex: 1">Ya le pagué</x-import>
</div>
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 26px; font-weight: 700">El viaje en números</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="grid-column: 1 / 3; padding: 18px; border-radius: 24px; background: var(--tinta); color: var(--papel); display: flex; justify-content: space-between; align-items: flex-end"><span style="display: flex; flex-direction: column"><span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.85">GASTARON ENTRE TODOS</span><span style="font-family: var(--font-display); font-size: 36px; line-height: 40px; font-weight: 800; font-variant-numeric: tabular-nums">$ 1.842.000</span></span><span style="font-size: 13px; line-height: 18px; opacity: 0.85">$ 307.000 c/u</span></div>
<div style="padding: 18px; border-radius: 24px; background: var(--lima); color: var(--sobre-color)"><span style="display: block; font-family: var(--font-display); font-size: 44px; line-height: 44px; font-weight: 800">23</span><span style="font-size: 14px; line-height: 20px; font-weight: 600">lugares visitados</span></div>
<div style="padding: 18px; border-radius: 24px; background: var(--mandarina); color: var(--sobre-color)"><span style="display: block; font-family: var(--font-display); font-size: 44px; line-height: 44px; font-weight: 800">41</span><span style="font-size: 14px; line-height: 20px; font-weight: 600">gastos cargados</span></div>
</div>
</section>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 20px">
<x-import component-from-global-scope="PX.BottomNav" default-active="resumen"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return { fede: -12400, tomi: 8150, zero: 0 };
}
}
</script>
</body>
</html>
