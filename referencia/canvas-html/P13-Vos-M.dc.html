<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PX — Vos (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/px/tokens.css">
<link rel="stylesheet" href="ds/px/components/bundle.css">
<script src="ds/px/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--mandarina-texto)}a:hover{color:var(--tinta)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: var(--font-texto)">
<div style="padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="width: 88px; height: 88px; border-radius: 50%; background: var(--lima); color: var(--sobre-color); display: grid; place-items: center; font-family: var(--font-display); font-size: 44px; font-weight: 800">N</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.03em">Nacho</h1>
<span style="font-size: 14px; line-height: 20px; color: var(--tinta-suave)">Salís de Buenos Aires · pesos</span>
</div>
</div>
<div style="position: relative; overflow: hidden; display: flex; gap: 8px">
<div style="flex: 1; padding: 16px; border-radius: 20px; background: var(--tinta); color: var(--papel)"><span style="display: block; font-family: var(--font-display); font-size: 40px; line-height: 40px; font-weight: 800">4</span><span style="font-size: 14px; line-height: 20px">viajes</span></div>
<div style="flex: 1; padding: 16px; border-radius: 20px; background: var(--mandarina); color: var(--sobre-color)"><span style="display: block; font-family: var(--font-display); font-size: 40px; line-height: 40px; font-weight: 800">31</span><span style="font-size: 14px; line-height: 20px">lugares</span></div>
<div style="flex: 1; padding: 16px; border-radius: 20px; background: var(--cielo); color: var(--sobre-color)"><span style="display: block; font-family: var(--font-display); font-size: 40px; line-height: 40px; font-weight: 800">3</span><span style="font-size: 14px; line-height: 20px">provincias</span></div>
</div>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card)">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">TU COLOR EN LOS GRUPOS</span>
<div style="display: flex; gap: 10px">
<button type="button" aria-pressed="true" aria-label="Lima" style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--tinta); background: var(--lima)"></button>
<button type="button" aria-pressed="false" aria-label="Mandarina" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--mandarina)"></button>
<button type="button" aria-pressed="false" aria-label="Cielo" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cielo)"></button>
<button type="button" aria-pressed="false" aria-label="Arena" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--linea-fuerte); background: var(--papel-hundido)"></button>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card)">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--tinta-suave)">CÓMO VIAJÁS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<x-import component-from-global-scope="PX.Chip" selected="{{yes}}">Hasta $ 40.000 la noche</x-import>
<x-import component-from-global-scope="PX.Chip" selected="{{yes}}">Ritmo tranqui</x-import>
<x-import component-from-global-scope="PX.Chip" icon="plus">Comida y alergias</x-import>
</div>
</section>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">Documentos</b><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">DNI y pasaporte</span></span>
<span style="font-size: 12px; line-height: 16px; font-weight: 700; background: var(--aviso-relleno); color: var(--sobre-color); padding: 3px 8px; border-radius: 999px">DNI vence en marzo</span>
<x-import component-from-global-scope="PX.Icon" name="chevron"></x-import>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">Aeropuertos de salida</b><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Aeroparque y Ezeiza</span></span>
<x-import component-from-global-scope="PX.Icon" name="chevron"></x-import>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--papel-elevado); box-shadow: var(--sombra-card); color: var(--tinta); text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px; line-height: 22px">Privacidad</b><span style="font-size: 13px; line-height: 18px; color: var(--tinta-suave)">Ubicación: te preguntamos en cada viaje</span></span>
<x-import component-from-global-scope="PX.Icon" name="chevron"></x-import>
</a>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 20px">
<x-import component-from-global-scope="PX.BottomNav" items="{{nav}}" default-active="vos"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, nav: [{ id: 'viajes', label: 'Mis viajes', icon: 'route' }, { id: 'vos', label: 'Vos', icon: 'user' }] };
}
}
</script>
</body>
</html>
